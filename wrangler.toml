# ==============================================================================
# AVAREST ONE — CLOUDFLARE WORKERS CONFIGURATION
# Do NOT put secrets in this file. Use `wrangler secret put` for keys.
# Optional Distributed Rate Limiter: bind a KV namespace as `RATE_LIMIT_KV`
# (or attach a Durable Object) in Cloudflare Workers for cross-PoP enforcement.
# ==============================================================================
name = "avarest-one-api"
main = "src/worker.ts"
compatibility_date = "2025-11-01"

[vars]
AVAREST_ENVIRONMENT = "staging"
SUPABASE_URL = "https://wdbtszlcdliwacvztmjl.supabase.co"
APP_URL = "https://staging.avarestai.com"

# Uncomment and set your Cloudflare KV namespace ID for distributed edge rate limiting:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "YOUR_STAGING_KV_NAMESPACE_ID"

[env.staging]
name = "avarest-ai-staging"
[env.staging.vars]
AVAREST_ENVIRONMENT = "staging"
VITE_ENVIRONMENT = "staging"
SUPABASE_URL = "https://wdbtszlcdliwacvztmjl.supabase.co"
VITE_SUPABASE_URL = "https://wdbtszlcdliwacvztmjl.supabase.co"
APP_URL = "https://avarest-ai-staging.avarestglobal.workers.dev"

# Existing Staging KV binding: bind namespace `avarest-ai-staging-rate-limit` as `RATE_LIMIT_KV`.
# Retrieve the real namespace ID from Cloudflare (`npx wrangler kv namespace list` or Dashboard -> KV)
# and uncomment below (never invent an ID):
# [[env.staging.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<ACTUAL_ID_FOR_avarest-ai-staging-rate-limit>"

[env.production]
name = "avarest-one-api-production"
[env.production.vars]
AVAREST_ENVIRONMENT = "production"
SUPABASE_URL = "https://zdvhksmtxelxcudssdus.supabase.co"
APP_URL = "https://avarestai.com"
